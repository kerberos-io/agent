name: Nightly build
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/image-release.yml
    with:
      source_ref: master
      nightly: true
    secrets: inherit
