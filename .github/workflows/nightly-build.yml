name: Nightly build
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: arm/v7
            runner: ubuntu-24.04
          - architecture: arm/v6
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build native media tests and image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker buildx build --platform "linux/$ARCHITECTURE" --target test .
          docker buildx build --platform "linux/$ARCHITECTURE" \
            --build-arg VERSION="${GITHUB_SHA:0:7}" --build-arg REVISION="$GITHUB_SHA" \
            --load -t agent-nightly:scan .
      - name: Verify exact image before publication
        uses: ./.github/actions/verify-image
        with:
          image: agent-nightly:scan
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push verified architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          target="kerberos/agent-nightly:arch-${ARCHITECTURE//\//-}-${GITHUB_SHA:0:7}"
          docker tag agent-nightly:scan "$target"
          docker push "$target"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Promote only the complete verified architecture set
        run: |
          sources=()
          for architecture in amd64 arm64 arm-v7 arm-v6; do
            sources+=("kerberos/agent-nightly:arch-$architecture-${GITHUB_SHA:0:7}")
          done
          docker buildx imagetools create -t "kerberos/agent-nightly:${GITHUB_SHA:0:7}" "${sources[@]}"
