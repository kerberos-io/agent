name: Build pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REPO: kerberos/agent

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Build
        env:
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          docker build --target test .
          docker build --build-arg VERSION="${REVISION:0:7}" --build-arg REVISION="$REVISION" -t ${{ matrix.architecture }} .
      - name: Verify exact image
        uses: ./.github/actions/verify-image
        with:
          image: ${{ matrix.architecture }}
      - name: Extract verified release bundle
        run: |
          CID=$(docker create ${{matrix.architecture}})
          docker cp ${CID}:/home/agent ./output-${{matrix.architecture}}
          docker rm ${CID}
      - name: Package binary and runtime assets
        run: tar -cf agent-${{matrix.architecture}}.tar -C output-${{matrix.architecture}} . && rm -rf output-${{matrix.architecture}}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{matrix.architecture}}.tar
          path: agent-${{matrix.architecture}}.tar
