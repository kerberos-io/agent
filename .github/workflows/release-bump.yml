name: Bump release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        default: patch
        type: choice
        options: [major, minor, patch]

permissions:
  contents: read

jobs:
  bump-release:
    permissions:
      contents: write
    # Verified revision supports reserving a tag with an unpublished draft.
    uses: uug-ai/workflows/.github/workflows/release-bump.yml@f31d4260a833e82228ca0e9b9163231a970feeb8
    with:
      bump: ${{ inputs.bump }}
      draft: true
    secrets: inherit

  release:
    needs: bump-release
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/image-release.yml
    with:
      tag: ${{ needs.bump-release.outputs.tag }}
      source_ref: ${{ format('refs/tags/{0}', needs.bump-release.outputs.tag) }}
      publish_latest: true
    secrets: inherit
