name: Create a new release
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the Docker image
        required: true
        default: test

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/image-release.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      source_ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.sha }}
      publish_latest: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == 'test' }}
    secrets: inherit
